<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 手势圣诞树 - 灵动音效版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #020502; 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute;
            top: 30px; left: 30px;
            color: #d4af37; 
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-weight: 200;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }
        .status-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 16px;
            background: rgba(10, 30, 10, 0.8);
            border: 1px solid #d4af37;
            border-radius: 30px;
            font-size: 0.85em;
            color: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            transition: all 0.3s;
        }

        #guide {
            position: absolute;
            bottom: 40px; left: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
            line-height: 2;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-left: 4px solid #228b22;
            border-radius: 8px;
            pointer-events: none;
        }
        .key-action { color: #d4af37; font-weight: bold; margin-right: 8px; }

        #camera-preview {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 200px; height: 150px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            overflow: hidden;
            transform: scaleX(-1);
            opacity: 0.6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        #upload-btn {
            position: absolute;
            top: 40px; right: 40px;
            pointer-events: auto;
            background: linear-gradient(45deg, #1a4a1a, #2d5a27);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 12px 28px;
            font-size: 14px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold;
        }

        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020502;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-size: 1.2rem;
            letter-spacing: 8px;
            z-index: 100;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div>正在唤醒星光...</div>
    </div>

    <div id="ui-layer">
        <h1 id="app-title">Merry Christmas</h1>
        <div class="status-badge" id="state-display">系统初始化中</div>
    </div>

    <div id="guide">
        <div><span class="key-action">✌️ 耶手势</span> 切换场景 (树/祝福文字)</div>
        <div><span class="key-action">✊ 握拳</span> 聚合圣诞树</div>
        <div><span class="key-action">✋ 张开</span> 星辰爆发 & 轮播</div>
        <div><span class="key-action">👌 捏合</span> 锁定当前照片</div>
    </div>

    <button id="upload-btn" onclick="document.getElementById('file-input').click()">上传记忆云</button>
    <input type="file" id="file-input" multiple accept="image/*" style="display:none">

    <div id="camera-preview">
        <video id="input_video" playsinline></video>
    </div>

    <!-- 音频元素 -->
    <audio id="bgm-tree" loop>
        <source src="/Merry Christmas.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgm-firework" loop>
        <source src="/烟花效果.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const CONFIG = {
            particleCount: 2200, 
            bloom: { strength: 1.4, radius: 0.7, threshold: 0.2 },
            treeCenterY: 2.5,
            carouselInterval: 1.0, 
            colors: {
                foliage: 0x0a3d0a, 
                ornamentGold: 0xd4af37, 
                ornamentRed: 0xa80000, 
                bg: 0x020502,
                starBase: 0xffd700, 
                starHighlight: 0xffffff 
            },
            fireworkFreq: 0.2 // 保持极速烟花频率
        };

        const STATES = { TREE: 'TREE', SCATTER: 'SCATTER' };
        const SCENES = { TREE: 0, TEXT: 1 };

        const TEXT_SCENES = [
            ["圣诞节快乐", "黄佳怡"]
        ];

        let state = {
            scene: SCENES.TREE,
            current: STATES.TREE,
            transition: 0,
            targetTransition: 0,
            cameraRot: { x: 0.5, y: 0 },
            focusedIdx: -1,
            isReady: false,
            isPinching: false, 
            carouselTimer: 0,
            sceneTransition: 0, 
            lastGestureTime: 0,
            fireworkTimer: 0,
            audioStarted: false // 用于处理浏览器自动播放策略
        };

        let scene, camera, renderer, composer, bloomPass, clock = new THREE.Clock();
        let particleGroups = [];
        let photos = [];
        let star; 
        let textParticles = []; 
        let fireworks = []; 
        
        const audioTree = document.getElementById('bgm-tree');
        const audioFirework = document.getElementById('bgm-firework');

        const rng = (s => () => (s = Math.sin(s) * 10000, s - Math.floor(s)))(2025);

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.02);
            
            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.LinearToneMapping; 
            renderer.toneMappingExposure = 1.0; 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const renderPass = new THREE.RenderPass(scene, camera);
            bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CONFIG.bloom.strength, CONFIG.bloom.radius, CONFIG.bloom.threshold
            );
            
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
            mainLight.position.set(5, 10, 7);
            scene.add(mainLight);

            const starPointLight = new THREE.PointLight(0xffd700, 2.0, 25);
            starPointLight.name = "starLight";
            scene.add(starPointLight);

            createParticles();
            createTreeStar(); 
            createTextParticles(); 
            
            window.addEventListener('resize', onResize);
            document.getElementById('file-input').addEventListener('change', onUpload);
        }

        // --- 音频管理函数 ---
        function updateAudio() {
            if (!state.isReady) return;

            // 如果还没开始播放（用户还没产生交互），则尝试播放
            if (!state.audioStarted) {
                audioTree.play().then(() => { state.audioStarted = true; }).catch(() => {});
            }

            if (state.scene === SCENES.TREE) {
                if (audioTree.paused) audioTree.play().catch(() => {});
                audioFirework.pause();
                audioFirework.currentTime = 0;
            } else {
                audioTree.pause();
                if (audioFirework.paused) audioFirework.play().catch(() => {});
            }
        }

        // --- 烟花效果类 ---
        class Firework {
            constructor() {
                this.isDead = false;
                this.state = 'rising'; 
                
                const spawnX = (Math.random() - 0.5) * 80;
                const spawnZ = (Math.random() - 0.5) * 60;
                this.position = new THREE.Vector3(spawnX, -15, spawnZ);
                this.velocity = new THREE.Vector3((Math.random()-0.5)*4, 18 + Math.random()*12, (Math.random()-0.5)*4);
                
                this.explodeHeight = 15 + Math.random() * 20;
                this.particles = null;
                this.colors = [0xff2222, 0xffd700, 0xffffff, 0x00ffff, 0xff00ff, 0x55ff55];
                this.colorValue = this.colors[Math.floor(Math.random() * this.colors.length)];
                
                this.trailGeometry = new THREE.BufferGeometry();
                this.trailMaterial = new THREE.PointsMaterial({ color: this.colorValue, size: 0.5, transparent: true, blending: THREE.AdditiveBlending });
                this.trailMesh = new THREE.Points(this.trailGeometry, this.trailMaterial);
                scene.add(this.trailMesh);
            }

            update(delta) {
                if (this.state === 'rising') {
                    this.position.add(this.velocity.clone().multiplyScalar(delta));
                    this.velocity.y -= 9.8 * delta * 0.6; 
                    if (this.position.y >= this.explodeHeight) this.explode();
                    this.trailGeometry.setAttribute('position', new THREE.Float32BufferAttribute([this.position.x, this.position.y, this.position.z], 3));
                } else if (this.state === 'exploding') {
                    const positions = this.particles.geometry.attributes.position.array;
                    const velocities = this.particles.userData.velocities;
                    for (let i = 0; i < velocities.length; i++) {
                        const v = velocities[i];
                        positions[i*3] += v.x * delta;
                        positions[i*3+1] += v.y * delta;
                        positions[i*3+2] += v.z * delta;
                        v.y -= 4.0 * delta; 
                        v.multiplyScalar(0.98); 
                    }
                    this.particles.geometry.attributes.position.needsUpdate = true;
                    this.particles.material.opacity -= 0.6 * delta; 
                    if (this.particles.material.opacity <= 0) this.destroy();
                }
            }

            explode() {
                this.state = 'exploding';
                scene.remove(this.trailMesh);
                const count = 220; 
                const positions = [];
                const velocities = [];
                for (let i = 0; i < count; i++) {
                    positions.push(this.position.x, this.position.y, this.position.z);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const speed = 7 + Math.random() * 10;
                    velocities.push(new THREE.Vector3(speed * Math.sin(phi) * Math.cos(theta), speed * Math.sin(phi) * Math.sin(theta), speed * Math.cos(phi)));
                }
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                const mat = new THREE.PointsMaterial({ color: this.colorValue, size: 0.5, transparent: true, blending: THREE.AdditiveBlending, opacity: 1.0, depthWrite: false });
                this.particles = new THREE.Points(geo, mat);
                this.particles.userData = { velocities };
                scene.add(this.particles);
            }

            destroy() {
                this.isDead = true;
                if (this.particles) scene.remove(this.particles);
                if (this.trailMesh) scene.remove(this.trailMesh);
            }
        }

        function createTextParticles() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1000; canvas.height = 400;
            const lines = TEXT_SCENES[0];
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            
            // 使用更粗的字体
            ctx.font = "900 85px Arial, sans-serif";
            ctx.fillText(lines[0], 500, 150);
            ctx.font = "900 65px Arial, sans-serif";
            ctx.fillText(lines[1], 500, 280);

			
            const imageData = ctx.getImageData(0, 0, 1000, 400);
            const data = imageData.data;
            const geometry = new THREE.BufferGeometry();
            const positions = [], origins = [];
            for (let y = 0; y < 400; y += 3) {
                for (let x = 0; x < 1000; x += 3) {
                    const alpha = data[(y * 1000 + x) * 4 + 3];
                    if (alpha > 120) {
                        const px = (x - 500) * 0.08, py = (200 - y) * 0.08 + CONFIG.treeCenterY, pz = (rng() - 0.5) * 0.5;
                        positions.push(px, py, pz); origins.push(px, py, pz);
                    }
                }
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0xfff0c0, size: 0.35, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
            const points = new THREE.Points(geometry, material);
            points.userData = { origins }; points.visible = false;
            scene.add(points); textParticles = points;
        }

        function createTreeStar() {
            const shape = new THREE.Shape();
            const points = 5, outerRadius = 1.9, innerRadius = 0.85;
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / points;
                const x = Math.cos(angle - Math.PI/2) * radius, y = Math.sin(angle - Math.PI/2) * radius;
                if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
            }
            shape.closePath();
            const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.3, bevelSegments: 5 };
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const material = new THREE.MeshStandardMaterial({ color: CONFIG.colors.starBase, emissive: CONFIG.colors.starBase, emissiveIntensity: 3.0, metalness: 1.0, roughness: 0.1 });
            star = new THREE.Mesh(geometry, material);
            star.renderOrder = 20;
            star.userData = { tP: new THREE.Vector3(0, 15.8 + CONFIG.treeCenterY, 0), sP: new THREE.Vector3(0, 26 + CONFIG.treeCenterY, 0) };
            scene.add(star);
        }

        function createParticles() {
            const geos = [new THREE.ConeGeometry(0.2, 0.6, 5), new THREE.SphereGeometry(0.35, 12, 12), new THREE.IcosahedronGeometry(0.3, 0)];
            const mats = [
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.foliage, roughness: 0.6, emissive: 0x052205, emissiveIntensity: 0.5 }),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.ornamentGold, metalness: 1.0, roughness: 0.1, emissive: 0x442200, emissiveIntensity: 1.0 }),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.ornamentRed, metalness: 0.8, roughness: 0.2, emissive: 0x330000, emissiveIntensity: 0.8 })
            ];
            const combos = [{ g:0, m:0, count: 1400 }, { g:1, m:1, count: 400 }, { g:1, m:2, count: 400 }];
            combos.forEach(c => {
                const mesh = new THREE.InstancedMesh(geos[c.g], mats[c.m], c.count);
                const tPos = [], sPos = [], rots = [];
                const dummy = new THREE.Object3D();
                for(let i=0; i<c.count; i++) {
                    const h = rng() * 26, rad = (26 - h) * 0.38, ang = rng() * Math.PI * 2;
                    const tx = Math.cos(ang) * (rad + (rng()-0.5)*1.5), ty = h - 13 + CONFIG.treeCenterY, tz = Math.sin(ang) * (rad + (rng()-0.5)*1.5);
                    tPos.push(new THREE.Vector3(tx, ty, tz));
                    const dist = 22 + rng() * 32, u = rng(), v = rng(), theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
                    sPos.push(new THREE.Vector3(dist * Math.sin(phi) * Math.cos(theta), dist * Math.sin(phi) * Math.sin(theta) + CONFIG.treeCenterY, dist * Math.cos(phi)));
                    rots.push(new THREE.Euler(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI));
                    dummy.position.copy(tPos[i]); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
                }
                mesh.userData = { tPos, sPos, rots, baseEmissive: mats[c.m].emissiveIntensity };
                scene.add(mesh); particleGroups.push(mesh);
            });
        }

        function onUpload(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const loader = new THREE.TextureLoader();
                loader.load(URL.createObjectURL(file), tex => {
                    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, opacity: 0, depthTest: true, depthWrite: true, color: new THREE.Color(0xffffff) });
                    const aspect = tex.image.width / tex.image.height;
                    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.5 * aspect, 2.5), mat);
                    const h = Math.random() * 22 - 10 + CONFIG.treeCenterY, r = ((26 - (h + 13 - CONFIG.treeCenterY)) * 0.38) + 0.8, a = Math.random() * Math.PI * 2;
                    mesh.userData = { tP: new THREE.Vector3(Math.cos(a)*r, h, Math.sin(a)*r), sP: new THREE.Vector3((Math.random()-0.5)*50, (Math.random()-0.5)*50 + CONFIG.treeCenterY, (Math.random()-0.5)*50) };
                    mesh.renderOrder = 50; scene.add(mesh); photos.push(mesh);
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            const targetSceneVal = state.scene === SCENES.TREE ? 0 : 1;
            state.sceneTransition = THREE.MathUtils.lerp(state.sceneTransition, targetSceneVal, 0.08);

            const showTree = state.sceneTransition < 0.95;
            const showText = state.sceneTransition > 0.05;

            if (showTree) {
                if (state.current === STATES.SCATTER && photos.length > 0) {
                    if (!state.isPinching) {
                        state.carouselTimer += delta;
                        if (state.carouselTimer > CONFIG.carouselInterval) {
                            state.focusedIdx = (state.focusedIdx + 1) % photos.length;
                            state.carouselTimer = 0;
                        }
                    }
                }
                const treeBreath = 1.0 + 0.8 * Math.sin(time * 1.5), starBreath = 0.5 + 0.55 * Math.sin(time * 1.5), fastPulsate = 0.5 + 0.4 * Math.sin(time * 8); 
                const isFocusing = (state.current === STATES.SCATTER && state.focusedIdx !== -1);
                state.transition += (state.targetTransition - state.transition) * 3 * delta;
                const treeAlpha = 1.0 - state.sceneTransition;

                if (star) {
                    star.visible = true;
                    star.position.lerp(new THREE.Vector3().lerpVectors(star.userData.tP, star.userData.sP, state.transition), 0.1);
                    star.position.y += Math.sin(time * 2) * 0.25; star.rotation.y += 0.025; 
                    star.material.emissiveIntensity = (isFocusing ? 0.5 : (2.5 + starBreath * 4.0 + fastPulsate * 1.0)) * treeAlpha; 
                    star.material.opacity = treeAlpha;
                    const starLight = scene.getObjectByName("starLight");
                    if(starLight) { starLight.position.copy(star.position); starLight.intensity = (isFocusing ? 0.2 : (1.5 + starBreath * 2.0)) * treeAlpha; }
                }

                const dummy = new THREE.Object3D();
                particleGroups.forEach(mesh => {
                    mesh.visible = true; mesh.material.emissiveIntensity = (isFocusing ? 0.1 : (mesh.userData.baseEmissive * (1.3 + treeBreath * 1.3))) * treeAlpha;
                    mesh.material.opacity = treeAlpha;
                    for(let i=0; i<mesh.count; i++) {
                        dummy.position.lerpVectors(mesh.userData.tPos[i], mesh.userData.sPos[i], state.transition);
                        dummy.rotation.set(mesh.userData.rots[i].x + time*0.2*state.transition, mesh.userData.rots[i].y + time*0.1*state.transition, mesh.userData.rots[i].z);
                        dummy.scale.setScalar((isFocusing ? 0.35 : 1.0) * treeAlpha); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
                    }
                    mesh.instanceMatrix.needsUpdate = true;
                });

                photos.forEach((p, i) => {
                    p.visible = true; let targetPos, targetScale = new THREE.Vector3(1,1,1), targetOpacity = treeAlpha, targetColor = new THREE.Color(0xffffff);
                    if(state.current === STATES.SCATTER && i === state.focusedIdx) {
                        targetPos = camera.position.clone().add(new THREE.Vector3(0, 0, -15).applyQuaternion(camera.quaternion));
                        targetScale.set(4, 4, 4); p.lookAt(camera.position); p.renderOrder = 999;
                        if (state.isPinching) targetColor.setRGB(0.9, 0.9, 0.6); else targetColor.setRGB(0.7, 0.7, 0.7); 
                    } else {
                        targetPos = new THREE.Vector3().lerpVectors(p.userData.tP, p.userData.sP, state.transition); p.lookAt(0, p.position.y, 0);
                        if(state.current === STATES.SCATTER) { targetScale.setScalar(0.5); targetOpacity = 0.4 * treeAlpha; } else { targetScale.setScalar(1.0); targetOpacity = 0.95 * treeAlpha; }
                    }
                    p.position.lerp(targetPos, 0.12); p.scale.lerp(targetScale, 0.12);
                    p.material.opacity = THREE.MathUtils.lerp(p.material.opacity, targetOpacity, 0.1); p.material.color.lerp(targetColor, 0.1);
                });
            } else {
                if(star) star.visible = false; particleGroups.forEach(m => m.visible = false); photos.forEach(p => p.visible = false);
            }

            if (showText) {
                textParticles.visible = true; textParticles.material.opacity = state.sceneTransition;
                const textBreath = 1.2 + 0.8 * Math.sin(time * 3.0);
                textParticles.material.color.setHex(CONFIG.colors.ornamentGold).multiplyScalar(textBreath * 1.5);
                const positions = textParticles.geometry.attributes.position.array, origins = textParticles.userData.origins;
                for (let i = 0; i < positions.length; i += 3) {
                    const idx = i / 3, yOffset = (1.0 - state.sceneTransition) * -20;
                    positions[i] = origins[i] + Math.cos(time * 1.5 + idx * 0.15) * 0.12;
                    positions[i+1] = origins[i+1] + Math.sin(time * 2.0 + idx * 0.15) * 0.12 + yOffset;
                    positions[i+2] = origins[i+2] + Math.sin(time * 2.5 + idx * 0.15) * 0.08;
                }
                textParticles.geometry.attributes.position.needsUpdate = true;

                if (state.sceneTransition > 0.8) {
                    state.fireworkTimer += delta;
                    if (state.fireworkTimer > CONFIG.fireworkFreq) { fireworks.push(new Firework()); state.fireworkTimer = 0; }
                }
            } else {
                textParticles.visible = false; fireworks.forEach(f => f.destroy()); fireworks = [];
            }

            for (let i = fireworks.length - 1; i >= 0; i--) { fireworks[i].update(delta); if (fireworks[i].isDead) fireworks.splice(i, 1); }

            if(state.current === STATES.SCATTER && state.scene === SCENES.TREE) {
                const r = 52, tx = r * Math.sin(state.cameraRot.x * Math.PI) * Math.cos(state.cameraRot.y * Math.PI * 2),
                      ty = Math.max(8, r * Math.cos(state.cameraRot.x * Math.PI)) + CONFIG.treeCenterY,
                      tz = r * Math.sin(state.cameraRot.x * Math.PI) * Math.sin(state.cameraRot.y * Math.PI * 2);
                camera.position.lerp(new THREE.Vector3(tx, ty, tz), 0.05);
            } else {
                camera.position.set(Math.sin(time * 0.2) * 45, 16, Math.cos(time * 0.2) * 45);
            }
            camera.lookAt(0, CONFIG.treeCenterY + 3, 0);
            
            if(bloomPass) {
                const isFocusing = (state.current === STATES.SCATTER && state.focusedIdx !== -1 && state.scene === SCENES.TREE);
                let targetStrength = CONFIG.bloom.strength + (Math.sin(time * 1.5) * 0.3);
                if (isFocusing) targetStrength = 0.4; else if (state.scene === SCENES.TEXT) targetStrength += 1.5; 
                bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, targetStrength, 0.1);
            }

            composer.render();
        }

        function setupMediaPipe() {
            const video = document.getElementById('input_video');
            const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });
            
            hands.onResults(results => {
                if(!state.isReady) return; 

                const status = document.getElementById('state-display');
                if(!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    state.isPinching = false; return;
                }
                
                const lm = results.multiHandLandmarks[0], wrist = lm[0];
                const isIndexExtended = Math.hypot(lm[8].x - wrist.x, lm[8].y - wrist.y) > 0.4,
                      isMiddleExtended = Math.hypot(lm[12].x - wrist.x, lm[12].y - wrist.y) > 0.4,
                      isRingFolded = Math.hypot(lm[16].x - wrist.x, lm[16].y - wrist.y) < 0.3,
                      isPinkyFolded = Math.hypot(lm[20].x - wrist.x, lm[20].y - wrist.y) < 0.3;

                if (isIndexExtended && isMiddleExtended && isRingFolded && isPinkyFolded && (Date.now() - state.lastGestureTime > 1500)) {
                    state.scene = state.scene === SCENES.TREE ? SCENES.TEXT : SCENES.TREE;
                    state.lastGestureTime = Date.now();
                    document.getElementById('app-title').innerText = state.scene === SCENES.TREE ? "Merry Christmas" : "Season's Greetings";
                    updateAudio(); // 每次切换场景时更新音频
                }

                if (state.scene === SCENES.TREE) {
                    const distFingers = [8, 12, 16, 20].reduce((s, i) => s + Math.hypot(lm[i].x-wrist.x, lm[i].y-wrist.y), 0) / 4;
                    state.isPinching = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) < 0.05; 
                    if(distFingers < 0.28) { 
                        if(state.current !== STATES.TREE) { state.current = STATES.TREE; state.targetTransition = 0; state.focusedIdx = -1; }
                        status.innerText = "状态：平安树 (✊握拳中)";
                    } else if(distFingers > 0.45) { 
                        if(state.current !== STATES.SCATTER) { state.current = STATES.SCATTER; state.targetTransition = 1; state.carouselTimer = 0; if(photos.length > 0 && state.focusedIdx === -1) state.focusedIdx = 0; }
                        status.innerText = photos.length > 0 ? (state.isPinching ? `记忆定格：${state.focusedIdx + 1}/${photos.length} (👌锁定中)` : `轮播记忆：${state.focusedIdx + 1}/${photos.length}`) : "状态：星辰散落 (✋张开中)";
                        state.cameraRot.x = lm[9].y; state.cameraRot.y = (lm[9].x - 0.5) * 2;
                    }
                    if (!state.audioStarted) updateAudio(); // 在第一次有效识别时开启音频
                } else {
                    status.innerText = "祝福场景：比 ✌️ 手势切换回圣诞树";
                    if (!state.audioStarted) updateAudio();
                }
            });

            const cam = new Camera(video, { onFrame: async () => await hands.send({ image: video }), width: 320, height: 240 });
            cam.start().then(() => {
                setTimeout(() => {
                    state.isReady = true;
                    document.getElementById('loading').style.opacity = '0';
                    document.getElementById('state-display').innerText = "比 ✌️ 切换场景以开启音乐";
                    setTimeout(() => { document.getElementById('loading').remove(); }, 1000);
                }, 1500); 
            });
        }

        function onResize() {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        }

        init(); setupMediaPipe(); animate();
    </script>
</body>
</html>
